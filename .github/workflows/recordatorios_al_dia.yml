name: Recordatorios apartados mensuales

on:
  schedule:
    # 08:00 Bogotá = 13:00 UTC
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: recordatorios-apartados-mensuales
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MI_JSON: ${{ secrets.MI_JSON }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install gspread google-auth google-api-python-client
      - run: python recordatorios_al_dia.py
