name: Mora 1 Cartera Dioben - Diagnostico
on:
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * *' # 08:15 America/Bogota
permissions:
  contents: read
concurrency:
  group: mora1-dioben-diagnostico
  cancel-in-progress: false
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MI_JSON: ${{ secrets.MI_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gspread google-auth
      - run: python mora1_dioben.py
      - name: Guardar resumen de simulacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mora1-simulacion-resumen
          path: mora1_simulacion_resumen.json
          if-no-files-found: warn
          retention-days: 7
