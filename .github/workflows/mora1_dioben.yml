name: Mora 1 Cartera Dioben - Diagnostico
on:
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * *' # 08:15 America/Bogota
permissions:
  contents: read
concurrency:
  group: mora1-dioben-diagnostico
  cancel-in-progress: false
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MI_JSON: ${{ secrets.MI_JSON }}
      MORA1_PREPARAR_BORRADORES: ${{ vars.MORA1_PREPARAR_BORRADORES }}
      MORA1_ENVIOS_REALES: ${{ vars.MORA1_ENVIOS_REALES }}
      MORA1_LIMITE_ENVIOS: ${{ vars.MORA1_LIMITE_ENVIOS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gspread google-auth
      - run: python mora1_dioben.py
      - name: Preparar borradores aprobados (nunca enviar)
        run: python mora1_preparar_borradores.py
      - name: Enviar Mora 1 (solo si habilitado explícitamente)
        if: ${{ vars.MORA1_ENVIOS_REALES == 'SI' }}
        env:
          MORA1_GMAIL_CLIENT_ID: ${{ secrets.MORA1_GMAIL_CLIENT_ID }}
          MORA1_GMAIL_CLIENT_SECRET: ${{ secrets.MORA1_GMAIL_CLIENT_SECRET }}
          MORA1_GMAIL_REFRESH_TOKEN: ${{ secrets.MORA1_GMAIL_REFRESH_TOKEN }}
        run: |
          pip install google-api-python-client google-auth-httplib2
          python mora1_enviar_programados.py
      - name: Guardar resumen de simulacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mora1-simulacion-resumen
          path: mora1_simulacion_resumen.json
          if-no-files-found: warn
          retention-days: 7
