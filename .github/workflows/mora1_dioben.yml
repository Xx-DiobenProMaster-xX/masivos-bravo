name: Mora 1 Cartera Dioben - Diagnostico
on:
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * *' # 08:15 America/Bogota
permissions:
  contents: read
concurrency:
  group: mora1-dioben-diagnostico
  cancel-in-progress: false
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MI_JSON: ${{ secrets.MI_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gspread google-auth
      - run: python mora1_dioben.py
