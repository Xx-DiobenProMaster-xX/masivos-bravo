name: PaB - Diagnóstico de candidatos (sin enviar)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MI_JSON: ${{ secrets.MI_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install gspread google-auth google-api-python-client
      - name: Revisar criterios PaB sin enviar ni modificar Sheets
        run: python pab_diagnostico.py
