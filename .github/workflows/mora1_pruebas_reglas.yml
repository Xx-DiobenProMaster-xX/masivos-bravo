name: Mora 1 - Pruebas de reglas sin clientes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar reglas Mora 1 sin Gmail ni Sheets
        run: python -m unittest -v test_mora1_reglas.py
