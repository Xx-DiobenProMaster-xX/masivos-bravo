name: Automatización PaB

on:
  workflow_dispatch:

  schedule:
    # 08:00 a. m. Colombia (UTC-5) = 13:00 UTC
    - cron: "0 13 * * *"

jobs:
  pab-automatico:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MI_JSON: ${{ secrets.MI_JSON }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar recordatorios PaB
        run: python pab_auto.py
