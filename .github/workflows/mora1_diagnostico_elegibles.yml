name: Mora 1 - Diagnosticar cero elegibles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MI_JSON: ${{ secrets.MI_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install gspread google-auth
      - name: Explicar exclusiones y borradores por fecha
        run: python mora1_diagnosticar_elegibles.py
