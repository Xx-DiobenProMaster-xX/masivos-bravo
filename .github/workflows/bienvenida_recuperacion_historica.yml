name: Bienvenida - Recuperación histórica controlada
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bienvenida-estructurados
  cancel-in-progress: false
jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MI_JSON: ${{ secrets.MI_JSON }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      BIENVENIDA_HISTORICA_ENVIOS_REALES: ${{ vars.BIENVENIDA_HISTORICA_ENVIOS_REALES }}
      BIENVENIDA_HISTORICA_LIMITE: ${{ vars.BIENVENIDA_HISTORICA_LIMITE || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install gspread google-auth google-api-python-client pandas openpyxl
      - name: Revisar y recuperar bienvenidas solo con habilitación explícita
        run: python bienvenida_recuperacion_historica.py
