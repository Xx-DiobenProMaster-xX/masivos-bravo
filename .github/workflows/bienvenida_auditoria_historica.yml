name: Bienvenida - Auditoría histórica (solo lectura)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MI_JSON: ${{ secrets.MI_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de lectura
        run: pip install gspread google-auth google-api-python-client pandas openpyxl
      - name: Auditar bienvenidas históricas sin modificar nada
        run: python bienvenida_auditoria_historica.py
